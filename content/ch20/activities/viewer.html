<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Study Module</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-hover: #15803d;
      --warning: #ea580c;
      --warning-hover: #c2410c;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #131b2e;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success: #22c55e;
      --success-hover: #4ade80;
      --warning: #f97316;
      --warning-hover: #fb923c;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    header {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .header-titles h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-titles p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    button.icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
    }

    button.icon-btn:hover {
      border-color: var(--primary);
    }

    /* Chapter Selector Drawer/Bar */
    .selector-container {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 240px;
    }

    .select-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
    }

    /* Stats & Toolbar */
    .deck-toolbar {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .tag-pill {
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* 3D Flashcard Canvas */
    .flashcard-stage {
      width: 100%;
      max-width: 760px;
      height: 380px;
      perspective: 1200px;
      cursor: pointer;
      user-select: none;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      padding: 2rem;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .flashcard-face.back {
      transform: rotateY(180deg);
      border-color: var(--primary);
    }

    .card-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-content {
      margin: auto 0;
      font-size: 1.25rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .card-content img {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 0.75rem;
      display: block;
    }

    .card-content ul, .card-content ol {
      margin-left: 1.5rem;
      font-size: 1.1rem;
    }

    .card-meta-bottom {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Controls */
    .controls {
      width: 100%;
      max-width: 760px;
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .btn {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    .btn-warning {
      background: var(--warning);
      color: #ffffff;
      border-color: var(--warning);
    }
    .btn-warning:hover {
      background: var(--warning-hover);
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }
    .btn-success:hover {
      background: var(--success-hover);
    }

    /* Keyboard Shortcuts Legend */
    .shortcuts-legend {
      width: 100%;
      max-width: 760px;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      color: var(--text);
    }

    .state-overlay {
      text-align: center;
      margin: auto;
      padding: 2rem;
    }
    .state-overlay h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .state-overlay p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    @media (max-width: 600px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      .flashcard-stage {
        height: 320px;
      }
      .card-content {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1 id="course-header">Course Flashcards</h1>
      <p id="deck-subtitle">Select a chapter to begin</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">🌓 Theme</button>
    </div>
  </header>

  <!-- Navigation / Chapter Select UI -->
  <div class="selector-container">
    <div class="select-group">
      <label for="chapter-select">Chapter Deck</label>
      <select id="chapter-select">
        <option value="">-- Loading Chapters... --</option>
      </select>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: flex-end;">
      <button class="icon-btn" id="shuffle-btn">🔀 Shuffle</button>
      <button class="icon-btn" id="filter-missed-btn">🎯 Missed Only (<span id="missed-count">0</span>)</button>
      <button class="icon-btn" id="reset-btn">🔄 Reset</button>
    </div>
  </div>

  <div class="deck-toolbar">
    <div>
      <span id="card-tag" class="tag-pill">Topic</span>
      <span id="card-reference" style="margin-left: 0.5rem; font-size: 0.75rem;"></span>
    </div>
    <div id="deck-progress">Card 0 of 0</div>
  </div>

  <!-- Interactive 3D Flashcard Stage -->
  <div class="flashcard-stage" id="stage" tabindex="0" role="region" aria-label="Flashcard">
    <div class="flashcard-inner" id="card-inner">
      
      <!-- Front Face -->
      <div class="flashcard-face front">
        <div class="card-meta-top">
          <span>Prompt / Question</span>
          <span>Click or Space to Flip</span>
        </div>
        <div class="card-content" id="front-content">
          Select a chapter deck to begin studying.
        </div>
        <div class="card-meta-bottom">
          <span>Front</span>
          <span id="front-status"></span>
        </div>
      </div>

      <!-- Back Face -->
      <div class="flashcard-face back">
        <div class="card-meta-top">
          <span style="color: var(--primary);">Answer / Explanation</span>
          <span>Click or Space to Flip</span>
        </div>
        <div class="card-content" id="back-content">
          Answer details will appear here.
        </div>
        <div class="card-meta-bottom">
          <span>Back</span>
          <span id="back-status"></span>
        </div>
      </div>

    </div>
  </div>

  <!-- Study Controls -->
  <div class="controls">
    <button class="btn" id="prev-btn" title="Previous Card">← Prev</button>
    <button class="btn btn-warning" id="need-review-btn" title="Mark as Need Review">⚠️ Need Review</button>
    <button class="btn btn-success" id="got-it-btn" title="Mark as Mastered">✓ Got It</button>
    <button class="btn" id="next-btn" title="Next Card">Next →</button>
  </div>

  <!-- Keyboard Shortcuts Bar -->
  <div class="shortcuts-legend">
    <span><span class="kbd">Space</span> Flip</span>
    <span><span class="kbd">←</span> <span class="kbd">→</span> Prev / Next</span>
    <span><span class="kbd">1</span> Need Review</span>
    <span><span class="kbd">2</span> Got It</span>
    <span><span class="kbd">S</span> Shuffle</span>
  </div>

  <script>
    // State Management
    let registryData = null;
    let rawDeck = [];
    let activeDeck = [];
    let currentIndex = 0;
    let missedOnlyMode = false;
    let courseCode = "Course";
    let activeRegistryFile = "flashcard_registry.json";

    // DOM Elements
    const stage = document.getElementById("stage");
    const cardInner = document.getElementById("card-inner");
    const frontContent = document.getElementById("front-content");
    const backContent = document.getElementById("back-content");
    const chapterSelect = document.getElementById("chapter-select");
    const courseHeader = document.getElementById("course-header");
    const deckSubtitle = document.getElementById("deck-subtitle");
    const deckProgress = document.getElementById("deck-progress");
    const cardTag = document.getElementById("card-tag");
    const cardRef = document.getElementById("card-reference");
    const missedCountSpan = document.getElementById("missed-count");
    const filterMissedBtn = document.getElementById("filter-missed-btn");
    const themeToggle = document.getElementById("theme-toggle");

    // LocalStorage Keys
    function getStorageKey(chapterId) {
      return `flashcards_${courseCode}_${chapterId}`;
    }

    function getProgressState(chapterId) {
      try {
        return JSON.parse(localStorage.getItem(getStorageKey(chapterId))) || { gotIt: [], needReview: [] };
      } catch (e) {
        return { gotIt: [], needReview: [] };
      }
    }

    function saveProgressState(chapterId, state) {
      localStorage.setItem(getStorageKey(chapterId), JSON.stringify(state));
      updateMissedBadge();
    }

    // Theme Management
    const initTheme = () => {
      const saved = localStorage.getItem("theme") || 
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", saved);
    };

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });

    // Fisher-Yates Random Shuffle
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // URL State Synchronizer
    function syncUrlParams(chapterId) {
      const url = new URL(window.location.href);
      if (activeRegistryFile !== "flashcard_registry.json") {
        url.searchParams.set("registry", activeRegistryFile);
      }
      if (chapterId) {
        url.searchParams.set("chapter", chapterId);
        url.searchParams.delete("ch");
      }
      window.history.replaceState({}, "", url.toString());
    }

    // Registry Loading with Parameter Detection
    async function loadRegistry() {
      const urlParams = new URLSearchParams(window.location.search);
      activeRegistryFile = urlParams.get("registry") || "flashcard_registry.json";
      const targetChapterId = urlParams.get("chapter") || urlParams.get("ch");

      try {
        const res = await fetch(activeRegistryFile);
        if (!res.ok) throw new Error(`Could not find ${activeRegistryFile}`);
        registryData = await res.json();
        
        courseCode = registryData.courseCode || "Course";
        courseHeader.textContent = `${registryData.courseCode}: ${registryData.courseTitle}`;
        
        chapterSelect.innerHTML = '<option value="">-- Choose a Chapter --</option>';
        
        let initialChapter = null;

        registryData.chapters.forEach(ch => {
          const opt = document.createElement("option");
          opt.value = ch.dataFile;
          opt.dataset.chapterId = ch.id;
          opt.dataset.title = ch.title;
          opt.textContent = `${ch.number}: ${ch.title}`;
          chapterSelect.appendChild(opt);

          if (targetChapterId && ch.id.toLowerCase() === targetChapterId.toLowerCase()) {
            initialChapter = ch;
          }
        });

        // Resolve which chapter to load: matched query param, or fallback to first chapter
        if (!initialChapter && registryData.chapters.length > 0) {
          initialChapter = registryData.chapters[0];
        }

        if (initialChapter) {
          chapterSelect.value = initialChapter.dataFile;
          loadChapter(initialChapter.dataFile, initialChapter.id, initialChapter.title, false);
        }
      } catch (err) {
        courseHeader.textContent = "Configuration Error";
        deckSubtitle.textContent = `Failed to load registry: ${activeRegistryFile}`;
        chapterSelect.innerHTML = `<option value="">Error loading manifest</option>`;
      }
    }

    // Chapter Loading
    async function loadChapter(url, chapterId, title, shouldUpdateUrl = true) {
      if (!url) return;
      deckSubtitle.textContent = title || "Loaded Deck";
      cardInner.classList.remove("is-flipped");
      missedOnlyMode = false;
      filterMissedBtn.style.borderColor = "var(--border)";

      if (shouldUpdateUrl) {
        syncUrlParams(chapterId);
      }

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to load ${url}`);
        const data = await res.json();
        rawDeck = data.cards || [];
        activeDeck = [...rawDeck];
        currentIndex = 0;
        updateMissedBadge();
        renderCard();
      } catch (err) {
        frontContent.innerHTML = `<span style="color:red;">Error loading deck data: ${url}</span>`;
        backContent.innerHTML = "";
      }
    }

    // Render Current Card
    function renderCard() {
      cardInner.classList.remove("is-flipped");

      if (!activeDeck || activeDeck.length === 0) {
        frontContent.innerHTML = `
          <div class="state-overlay">
            <h3>Deck Complete! 🎉</h3>
            <p>You have reviewed all cards in this category.</p>
          </div>`;
        backContent.innerHTML = `<div class="state-overlay"><p>Reset deck or switch chapters.</p></div>`;
        cardTag.textContent = "Finished";
        cardRef.textContent = "";
        deckProgress.textContent = "0 of 0";
        return;
      }

      if (currentIndex >= activeDeck.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = activeDeck.length - 1;

      const card = activeDeck[currentIndex];
      const selectedOption = chapterSelect.selectedOptions[0];
      const chapterId = selectedOption ? selectedOption.dataset.chapterId : null;
      const progress = chapterId ? getProgressState(chapterId) : { gotIt: [], needReview: [] };

      // Render Front & Back
      frontContent.innerHTML = card.front;
      backContent.innerHTML = card.back;
      cardTag.textContent = card.tag || "General";
      cardRef.textContent = card.reference ? `Ref: ${card.reference}` : "";
      deckProgress.textContent = `Card ${currentIndex + 1} of ${activeDeck.length}`;

      const isGotIt = progress.gotIt.includes(card.id);
      const isNeedReview = progress.needReview.includes(card.id);
      const statusText = isGotIt ? "✓ Marked Got It" : (isNeedReview ? "⚠️ Marked For Review" : "Unreviewed");
      
      document.getElementById("front-status").textContent = statusText;
      document.getElementById("back-status").textContent = statusText;
    }

    function updateMissedBadge() {
      const selectedOption = chapterSelect.selectedOptions[0];
      if (!selectedOption) return;
      const chapterId = selectedOption.dataset.chapterId;
      const progress = getProgressState(chapterId);
      missedCountSpan.textContent = progress.needReview.length;
    }

    // Actions
    function flipCard() {
      if (activeDeck.length > 0) {
        cardInner.classList.toggle("is-flipped");
      }
    }

    function nextCard() {
      if (activeDeck.length > 0) {
        currentIndex = (currentIndex + 1) % activeDeck.length;
        renderCard();
      }
    }

    function prevCard() {
      if (activeDeck.length > 0) {
        currentIndex = (currentIndex - 1 + activeDeck.length) % activeDeck.length;
        renderCard();
      }
    }

    function markStatus(type) {
      if (!activeDeck.length) return;
      const card = activeDeck[currentIndex];
      const chapterId = chapterSelect.selectedOptions[0]?.dataset.chapterId;
      if (!chapterId) return;

      const progress = getProgressState(chapterId);

      progress.gotIt = progress.gotIt.filter(id => id !== card.id);
      progress.needReview = progress.needReview.filter(id => id !== card.id);

      if (type === "got-it") {
        progress.gotIt.push(card.id);
      } else if (type === "need-review") {
        progress.needReview.push(card.id);
      }

      saveProgressState(chapterId, progress);
      nextCard();
    }

    function toggleMissedOnly() {
      const chapterId = chapterSelect.selectedOptions[0]?.dataset.chapterId;
      if (!chapterId) return;
      const progress = getProgressState(chapterId);

      if (!missedOnlyMode) {
        const filtered = rawDeck.filter(c => progress.needReview.includes(c.id));
        if (filtered.length === 0) {
          alert("No cards are currently flagged as 'Need Review'.");
          return;
        }
        activeDeck = filtered;
        missedOnlyMode = true;
        filterMissedBtn.style.borderColor = "var(--warning)";
      } else {
        activeDeck = [...rawDeck];
        missedOnlyMode = false;
        filterMissedBtn.style.borderColor = "var(--border)";
      }
      currentIndex = 0;
      renderCard();
    }

    // Event Listeners
    stage.addEventListener("click", flipCard);
    document.getElementById("next-btn").addEventListener("click", nextCard);
    document.getElementById("prev-btn").addEventListener("click", prevCard);
    document.getElementById("got-it-btn").addEventListener("click", () => markStatus("got-it"));
    document.getElementById("need-review-btn").addEventListener("click", () => markStatus("need-review"));
    filterMissedBtn.addEventListener("click", toggleMissedOnly);

    document.getElementById("shuffle-btn").addEventListener("click", () => {
      activeDeck = shuffleArray(activeDeck);
      currentIndex = 0;
      renderCard();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      const chapterId = chapterSelect.selectedOptions[0]?.dataset.chapterId;
      if (chapterId && confirm("Reset all review progress for this chapter?")) {
        localStorage.removeItem(getStorageKey(chapterId));
        activeDeck = [...rawDeck];
        missedOnlyMode = false;
        filterMissedBtn.style.borderColor = "var(--border)";
        updateMissedBadge();
        currentIndex = 0;
        renderCard();
      }
    });

    chapterSelect.addEventListener("change", (e) => {
      const opt = e.target.selectedOptions[0];
      if (opt && opt.value) {
        loadChapter(opt.value, opt.dataset.chapterId, opt.dataset.title, true);
      }
    });

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;

      switch (e.code) {
        case "Space":
          e.preventDefault();
          flipCard();
          break;
        case "ArrowRight":
          e.preventDefault();
          nextCard();
          break;
        case "ArrowLeft":
          e.preventDefault();
          prevCard();
          break;
        case "Digit1":
        case "Numpad1":
          markStatus("need-review");
          break;
        case "Digit2":
        case "Numpad2":
          markStatus("got-it");
          break;
        case "KeyS":
          activeDeck = shuffleArray(activeDeck);
          currentIndex = 0;
          renderCard();
          break;
      }
    });

    // Initialization
    initTheme();
    loadRegistry();
  </script>
</body>
</html>
