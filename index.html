<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINS 4403: Physiology of Exercise — Course Dashboard</title>
  <style>
    :root {
      --primary: #17324d;
      --primary-light: #2c4d6f;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --success: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--slate-50);
      color: var(--slate-800);
      line-height: 1.6;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 36px 20px;
      border-bottom: 4px solid var(--accent);
    }
    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
    }
    .course-badge {
      display: inline-block;
      background: var(--primary-light);
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 6px; }
    header p { color: #cbd5e1; font-size: 1.05rem; max-width: 720px; }

    .container {
      max-width: 1040px;
      margin: 32px auto;
      padding: 0 16px 80px 16px;
    }

    .chapter-section {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .chapter-header {
      background: var(--slate-100);
      padding: 14px 20px;
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chapter-header h2 {
      font-size: 1.15rem;
      color: var(--primary);
      font-weight: 700;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .badge.available { background: #dcfce7; color: var(--success); }
    .badge.upcoming { background: #f1f5f9; color: var(--slate-600); border: 1px solid var(--slate-200); }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .module-card {
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      border-color: #cbd5e1;
    }
    .module-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .module-card h3 {
      font-size: 1.05rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .module-card p {
      font-size: 0.9rem;
      color: var(--slate-600);
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .btn-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .btn-launch:hover { background: var(--accent-hover); }

    .empty-state {
      padding: 24px 20px;
      color: var(--slate-600);
      font-style: italic;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="course-badge">Online Learning Modules</div>
    <h1>KINS 4403: Physiology of Exercise</h1>
    <p>Interactive lecture modules, physiological mechanism walkthroughs, applied clinical scenarios, and formative knowledge checks.</p>
  </div>
</header>

<div class="container" id="courseTree"></div>

<script>
  // COURSE CURRICULUM CONFIGURATION
  // Set "active": true when content is written and ready in content/chXX/
  const courseData = [
    {
      chapterNum: "10",
      chapterFolder: "10",
      title: "Adaptations to Resistance Training",
      active: true,
      modules: [
        {
          id: "10.1",
          title: "Resistance Training and Gains in Muscular Fitness",
          desc: "Principles of progressive overload, specificity, muscular adaptations, and strength vs. power training."
        },
        {
          id: "10.2",
          title: "Mechanisms of Gains in Muscle Strength",
          desc: "Neural drivers, rate coding, motor unit synchronization, autogenic inhibition, and transient vs. chronic hypertrophy."
        },
        {
          id: "10.3",
          title: "Interaction Between Resistance Training and Diet",
          desc: "Protein synthesis, mTOR signaling, leucine thresholds, post-exercise nutrient timing, and glycogen replenishment."
        },
        {
          id: "10.4",
          title: "Resistance Training for Special Populations",
          desc: "Sarcopenia in older adults, youth resistance considerations, and programming modifications for clinical populations."
        }
      ]
    },
    {
      chapterNum: "11",
      chapterFolder: "11",
      title: "Adaptations to Aerobic & Anaerobic Training",
      active: true,
      modules: [
        {
          id: "11.1",
          title: "Adaptations to Aerobic Training",
          desc: "Fick equation mechanics, eccentric cardiac hypertrophy, plasma expansion, capillarization, and glycogen sparing."
        },
        {
          id: "11.2",
          title: "Adaptations to Anaerobic Training",
          desc: "ATP-PCr buffering, glycolytic enzyme upregulation, anaerobic capacity, and muscle buffering capacity."
        },
        {
          id: "11.3",
          title: "Adaptations to High-Intensity Interval Training",
          desc: "HIIT vs. continuous endurance, mitochondrial biogenesis, PGC-1alpha activation, and cardiovascular efficiency."
        },
        {
          id: "11.4",
          title: "Specificity of Training and Cross-Training",
          desc: "Concurrent training interference effect, AMPk vs. mTOR cross-talk, transfer of training, and sport-specific conditioning."
        }
      ]
    },
    {
      chapterNum: "12",
      chapterFolder: "12",
      title: "Cardiorespiratory Control During Exercise",
      active: false,
      modules: []
    }
  ];

  function renderDashboard() {
    const root = document.getElementById('courseTree');
    root.innerHTML = '';

    courseData.forEach(ch => {
      const section = document.createElement('section');
      section.className = 'chapter-section';

      const header = document.createElement('div');
      header.className = 'chapter-header';
      header.innerHTML = `
        <h2>Chapter ${ch.chapterNum}: ${ch.title}</h2>
        <span class="badge ${ch.active ? 'available' : 'upcoming'}">
          ${ch.active ? 'Available' : 'Coming Soon'}
        </span>
      `;
      section.appendChild(header);

      if (ch.active && ch.modules.length > 0) {
        const grid = document.createElement('div');
        grid.className = 'module-grid';

        ch.modules.forEach(m => {
          const card = document.createElement('div');
          card.className = 'module-card';
          card.innerHTML = `
            <div>
              <div class="module-num">Module ${m.id}</div>
              <h3>${m.title}</h3>
              <p>${m.desc}</p>
            </div>
            <a class="btn-launch" href="viewer.html?ch=${ch.chapterFolder}&mod=${m.id}">
              Launch Module &rarr;
            </a>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'Module reading and interactive assessments are currently in development.';
        section.appendChild(empty);
      }

      root.appendChild(section);
    });
  }

  window.addEventListener('DOMContentLoaded', renderDashboard);
</script>

</body>
</html>
